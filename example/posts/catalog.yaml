# 目录路由与文件搬运规则
# path 必填
# title subtitle description 会自动继承根目录相同的属性
#
# transfers 为文件搬运映射，每项包含：
#   source: 源路径。`.` 或 `/` 表示当前路由目录，否则拼接到路由 path 之下
#   target: 目标输出路径（作为该目录的外部路径）
# 搬运是整目录映射：路由目录下的内容会输出到 target 指定的位置。
# 例如 path: /introduction + source: . + target: /intro/Well-known
# 会把 posts/introduction/ 下的所有内容输出到 /intro/Well-known/。
# 根目录 path: "/" 的 transfers 无效。
-   path: /
    transfers: # 根目录 transfers 无效
    title: Musicals
    subtitle: Musical theatre is a form of theatrical performance that combines songs, spoken dialogue, acting and dance.
    description: |
        The story and emotional content of a musical – humor, pathos, love, anger – are communicated through words, music, movement and technical aspects of the entertainment as an integrated whole. Although musical theatre overlaps with other theatrical forms like opera and dance, it may be distinguished by the equal importance given to the music as compared with the dialogue, movement and other elements. Since the early 20th century, musical theatre stage works have generally been called, simply, musicals.

-   path: /introduction                       # 指定源目录
    transfers:
        -   source: .                         # 文件搬运映射，./... 搬运到 /intro/Well-known/...
            target: /intro/Well-known  # 不设置则保留原文件夹，也可以指定为搬运文件
    title: Well-known musicals                # 该级目录页面标题
    subtitle:                                 # 该级目录 subtitle
    description: |                            # 该级目录简介
        1. Man of la Mancha
        2. Mozart!
        3. The Phantom of the Opera


-   path: /Don Juan
    transfers:
        -   source: .
            target: /M
    title: Don Juan
    subtitle: |
        Don Juan , also known as Don Giovanni (Italian), is a legendary fictional Spanish libertine who devotes his life to seducing women.
    description: |
        The original version of the story of Don Juan appears in the 1630 play El burlador de Sevilla y convidado de piedra (The Trickster of Seville and the Stone Guest) by Tirso de Molina. The play includes most of the elements found and later adapted in subsequent works, including the setting (Seville), the characters (Don Juan, his servant, his love interest, and her father, whom he kills), moralistic themes (honor, violence and seduction, vice and retribution), and the dramatic ending in which Don Juan dines with and is then dragged down to hell by the stone statue of the father he had previously slain. Tirso de Molina's play was subsequently adapted into numerous plays and poems, of which the most famous include a 1665 play, Dom Juan, by Molière; a 1787 opera, Don Giovanni, with music by Mozart and a libretto by Lorenzo da Ponte largely adapting Tirso de Molina's play; a satirical and epic poem, Don Juan, by Lord Byron; and Don Juan Tenorio, a romantic play by José Zorrilla.
