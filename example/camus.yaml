# 输出相关配置
meta: true                                  # 是否生成元信息 /meta.json，其内容会因构建类型不同而不同
sitemap: true                               # 自动生成 sitemap.xml
filename_case: keep                         # 转换md的输出文件名：keep 不转换，uuid 自动转换为 /uuid.html
# 对外访问地址，构建产物中的链接会以此为前缀
# 自动拆解为 protocol / domain_name / path_prefix：
#   https://stdout.com.cn/camus -> protocol=https:// domain_name=stdout.com.cn path_prefix=/camus
public_url: https://stdout.com.cn/camus
# CDN 地址，供 with_cdn() 使用（例如 CSS 中的字体地址）
# 默认为空；为空时 with_cdn(path) 原样返回 path，不做任何替换
cdn_url: ''
# 页面渲染配置
theme: pixel                             # 加载 theme/name/*.html
pdf_engine: chrome                          # PDF 引擎：chromium/chrome/edge（Linux 自动按 PATH 查找）；disable 时不生成 PDF
pdf_options:
    - --headless
    - --enable-logging
    - --no-pdf-header-footer
    - --print-to-pdf={{dest_dir}}/index.pdf  # {{dest_dir}} 为 PDF 输出目录，可自定义文件名与位置
markdown_options:                           # markdown 引擎参数
    - DEFAULT                               # 默认选项，采用安全模式（过滤原始HTML和危险链接）
    - VALIDATE_UTF8                         # 解析前验证 UTF-8 编码，将非法序列替换为替换字符 U+FFFD
    - SMART                                 # 智能排版：将直引号转为弯引号，---转为长破折号，--转为短破折号
    - FOOTNOTES                             # 解析脚注语法
    - FULL_INFO_STRING                      # 代码块中保留完整信息字符串，并在独立的属性中提供
    - TABLE_PREFER_STYLE_ATTRIBUTES         # 表格单元格对齐使用 style 属性而非 align 属性
    - UNSAFE                                # 渲染原始 HTML 和不安全链接（如javascript:等），默认会过滤
    #   - SOURCEPOS                         # 在所有块级元素上添加 data-sourcepos 属性，标明源位置
    #   - HARDBREAKS                        # 将 softbreak（换行）渲染为强制换行标签 <br />
    #   - NOBREAKS                          # 将 softbreak 渲染为空格（而不是换行）
    #   - GITHUB_PRE_LANG                   # 代码块使用 GitHub 风格 <pre lang="x">
    #   - LIBERAL_HTML_TAG                  # 放宽对内联 HTML 标签的解析，允许更自由的标签格式
    #   - STRIKETHROUGH_DOUBLE_TILDE        # 仅当删除线由恰好2个波浪线包围时才解析，提高与 redcarpet 的兼容性

# 友情链接
friends:
    -   title: Alex                                # 站点标题
        link_url: https://github.com/o8x/camus     # 跳转地址
        image_url: https://stdout.com.cn/logo.png  # 头像链接
        desc: What's past is prologue.             # 简短描述

    -   title: 一言网
        link_url: https://hitokoto.cn
        image_url: https://i.loli.net/2020/02/07/kDIUWCQpKEdFTP8.png
        desc: 一言网（hitokoto.cn）创立于 2016 年，隶属于萌创团队，目前网站主要提供一句话服务。

# 目录路由与文件搬运规则见源目录（posts/ 或 src/）下的 catalog.yaml

# 目录搬运规则：把 path 目录的内容映射到 target 输出路径
# 每个目录的 title / subtitle / description 来自该目录下的 README.md
build:
    -   path: /introduction                       # 指定源目录
        transfers:
            -   source: .                         # `.` 或 `/` 表示路由目录自身，否则拼接到 path 之下
                target: /intro/Well-known         # 目标输出路径

    -   path: /Don Juan
        transfers:
            -   source: .
                target: /M
