name: CMake on multiple platforms

on:
    push:
        branches: [ "main" ]
        tags:
            - 'v*.*.*'
    pull_request:
        branches: [ "main" ]

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build-ubuntu:
        runs-on: ubuntu-24.04
        env:
            LANG: C.UTF-8
            LC_ALL: C.UTF-8
        container:
            image: docker.io/ubuntu:24.04

        steps:
            -   name: Install dependencies
                run: |
                    apt update -y
                    apt install -y git ninja-build make cmake pkg-config gcc g++ mold dpkg-dev libssl-dev

            -   uses: actions/checkout@v4

            -   name: Build
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git submodule update --init --recursive
                    make package

            -   name: Install Test
                working-directory: build/release/packages
                env:
                    CAMUS_AUTO_CHECK_UPDATE: "false"
                run: |
                    dpkg -i *.deb
                    camus -v
                    camus --build -dw "$GITHUB_WORKSPACE/example"
                    camus -iw /tmp/site
                    camus -cw /tmp/site-copy

            -   name: Upload
                uses: actions/upload-artifact@v4
                with:
                    name: Ubuntu-Artifacts
                    path: build/release/packages
                    if-no-files-found: error

    build-macos:
        runs-on: macos-15
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Cache Homebrew downloads
                uses: actions/cache@v4
                with:
                    path: ~/Library/Caches/Homebrew
                    key: ${{ runner.os }}-homebrew-v1
                    restore-keys: |
                        ${{ runner.os }}-homebrew-

            -   name: Install dependencies
                run: |
                    brew install git make cmake pkg-config ninja llvm@21 openssl@3

            -   name: Build
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git submodule update --init --recursive
                    export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$PKG_CONFIG_PATH"
                    make package

            -   name: Install Test
                working-directory: build/release/packages
                env:
                    CAMUS_AUTO_CHECK_UPDATE: "false"
                run: |
                    sudo installer -pkg *.pkg -target /
                    camus -v
                    camus --build -dw "$GITHUB_WORKSPACE/example"
                    camus -iw /tmp/site
                    camus -cw /tmp/site-copy

            -   name: Upload artifact
                uses: actions/upload-artifact@v4
                with:
                    name: MacOS-Artifacts
                    path: build/release/packages
                    if-no-files-found: error

    release:
        if: github.ref_type == 'tag'
        runs-on: ubuntu-24.04
        needs: [ build-macos, build-ubuntu ]
        steps:
            -   name: Download artifact
                uses: actions/download-artifact@v4
                with:
                    path: packages
                    merge-multiple: true

            -   name: List artifact
                working-directory: packages
                run: ls -l

            -   name: Generate latest.json
                working-directory: packages
                run: |
                    python3 - <<'PY'
                    import datetime
                    import glob
                    import json
                    import os

                    tag = os.environ["GITHUB_REF_NAME"]
                    version = tag.lstrip("vV")
                    repo = os.environ["GITHUB_REPOSITORY"]
                    extensions = (".dmg", ".pkg", ".rpm", ".deb", ".exe")
                    assets = []
                    for path in sorted(glob.glob("*")):
                        name = os.path.basename(path)
                        if not name.endswith(extensions):
                            continue
                        assets.append({
                            "name": name,
                            "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                        })

                    data = {
                        "version": version,
                        "tag": tag,
                        "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                        "assets": assets,
                    }
                    with open("latest.json", "w", encoding="utf-8") as stream:
                        json.dump(data, stream, ensure_ascii=False, indent=2)
                    print(open("latest.json", encoding="utf-8").read())
                    PY

            -   name: Release ${{ github.ref_name }}
                uses: softprops/action-gh-release@v3
                if: github.ref_type == 'tag'
                with:
                    name: Release ${{ github.ref_name }}
                    files: |
                        packages/latest.json
                        packages/*.dmg
                        packages/*.pkg
                        packages/*.rpm
                        packages/*.deb
                        packages/*.exe

    pages:
        if: github.ref_type == 'tag'
        runs-on: ubuntu-24.04
        needs: [ build-ubuntu ]
        container:
            image: docker.io/ubuntu:24.04
        steps:
            -   name: Install git
                run: |
                    apt-get update -y
                    apt-get install -y --no-install-recommends git ca-certificates

            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Verify tag on main
                id: verify
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git rev-parse --verify origin/main
                    if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                        echo "deploy=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "deploy=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Get Camus
                if: steps.verify.outputs.deploy == 'true'
                uses: actions/download-artifact@v4
                with:
                    path: packages
                    merge-multiple: true

            -   name: Setup Pages
                if: steps.verify.outputs.deploy == 'true'
                id: pages
                uses: actions/configure-pages@v5

            -   name: Build Pages
                if: steps.verify.outputs.deploy == 'true'
                env:
                    CAMUS_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
                    CAMUS_AUTO_CHECK_UPDATE: "false"
                run: |
                    apt update -y
                    dpkg -i packages/camus-*.deb
                    camus --build -dw example

            -   name: Upload artifact
                if: steps.verify.outputs.deploy == 'true'
                uses: actions/upload-pages-artifact@v3
                with:
                    path: './example/dist/html'

            -   name: Deploy to GitHub Pages
                if: steps.verify.outputs.deploy == 'true'
                id: deployment
                uses: actions/deploy-pages@v5
