name: CMake on multiple platforms

on:
    push:
        branches: [ "main" ]
        tags:
            - 'v*.*.*'
    pull_request:
        branches: [ "main" ]

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build-ubuntu:
        runs-on: ubuntu-24.04
        env:
            LANG: C.UTF-8
            LC_ALL: C.UTF-8
        container:
            image: docker.io/ubuntu:24.04

        steps:
            -   name: Install dependencies
                run: |
                    apt update -y
                    apt install -y git ninja-build make cmake pkg-config gcc g++ mold dpkg-dev

            -   uses: actions/checkout@v4

            -   name: Build
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git submodule update --init --recursive
                    make package

            -   name: Install Test
                working-directory: build/release/packages
                run: |
                    dpkg -i *.deb
                    camus -v
                    camus -dw "$GITHUB_WORKSPACE/example"
                    camus -iw /tmp/site
                    camus -cw /tmp/site-copy

            -   name: Upload
                uses: actions/upload-artifact@v4
                with:
                    name: Ubuntu-Artifacts
                    path: build/release/packages
                    if-no-files-found: error

    build-macos:
        runs-on: macos-15
        steps:
            -   name: Install dependencies
                run: |
                    brew update
                    brew install git make cmake pkg-config ninja llvm@21

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Build
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git submodule update --init --recursive
                    make package

            -   name: Install Test
                working-directory: build/release/packages
                run: |
                    sudo installer -pkg *.pkg -target /
                    camus -v
                    camus -dw "$GITHUB_WORKSPACE/example"
                    camus -iw /tmp/site
                    camus -cw /tmp/site-copy

            -   name: Upload artifact
                uses: actions/upload-artifact@v4
                with:
                    name: MacOS-Artifacts
                    path: build/release/packages
                    if-no-files-found: error

    release:
        if: github.ref_type == 'tag'
        runs-on: ubuntu-24.04
        needs: [ build-macos, build-ubuntu ]
        steps:
            -   name: Download artifact
                uses: actions/download-artifact@v4
                with:
                    path: packages
                    merge-multiple: true

            -   name: List artifact
                working-directory: packages
                run: ls -l

            -   name: Release ${{ github.ref_name }}
                uses: softprops/action-gh-release@v3
                if: github.ref_type == 'tag'
                with:
                    name: Release ${{ github.ref_name }}
                    files: |
                        packages/*.dmg
                        packages/*.pkg
                        packages/*.rpm
                        packages/*.deb
                        packages/*.exe

    pages:
        if: github.ref_type == 'tag'
        runs-on: ubuntu-24.04
        needs: [ build-ubuntu ]
        container:
            image: docker.io/ubuntu:24.04
        steps:
            -   name: Install git
                run: |
                    apt-get update -y
                    apt-get install -y --no-install-recommends git ca-certificates

            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Verify tag on main
                id: verify
                run: |
                    if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                        echo "deploy=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "deploy=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Get Camus
                if: steps.verify.outputs.deploy == 'true'
                uses: actions/download-artifact@v4
                with:
                    path: packages
                    merge-multiple: true

            -   name: Build Pages
                if: steps.verify.outputs.deploy == 'true'
                run: |
                    apt update -y
                    dpkg -i packages/camus-*.deb
                    camus -dw example

            -   name: Setup Pages
                if: steps.verify.outputs.deploy == 'true'
                uses: actions/configure-pages@v5

            -   name: Upload artifact
                if: steps.verify.outputs.deploy == 'true'
                uses: actions/upload-pages-artifact@v3
                with:
                    path: './example/dist/html'

            -   name: Deploy to GitHub Pages
                if: steps.verify.outputs.deploy == 'true'
                id: deployment
                uses: actions/deploy-pages@v5
